name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    env:
      # Unit tests don't hit Supabase, but modules that import ./lib/supabase
      # throw at load without these. Real values are injected at deploy time.
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci installs exactly what package-lock.json pins — reproducible and
      # fails loudly on lockfile drift (the class of bug behind the manualChunks
      # incident). Keep the lockfile in sync in the same commit as package.json.
      - run: npm ci --no-audit --no-fund

      # Lint runs for the log, not for the verdict. 163 problems are
      # pre-existing and 115 of them are no-explicit-any on hand-typed API
      # payloads — a burn-down someone has to sit down and do, not a
      # mechanical fix, so failing on zero today would block every PR.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      # The COUNT is the gate. .eslint-baseline holds today's number and this
      # step fails when a PR pushes it higher, so new problems cannot ride in
      # while the old ones are being worked off. Fixing lint means lowering the
      # baseline in the same PR. When it reaches 0: delete this step and the
      # baseline file, and drop continue-on-error from the step above.
      - name: Lint (no new problems)
        run: |
          COUNT=$(npx eslint . -f json | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{const r=JSON.parse(s);console.log(r.reduce((n,f)=>n+f.errorCount+f.warningCount,0));});")
          BASELINE=$(cat .eslint-baseline 2>/dev/null || echo 0)
          echo "Lint problems: $COUNT (baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::Lint problems increased from $BASELINE to $COUNT. The Lint (advisory) step above lists them."
            exit 1
          fi

      # Typecheck is a hard gate: the ratchet reached 0, so any type error is a
      # new type error.
      - run: npm run typecheck

      - run: npm run test

      - run: npm run build
