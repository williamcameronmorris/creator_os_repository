name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    env:
      # Unit tests don't hit Supabase, but modules that import ./lib/supabase
      # throw at load without these. Real values are injected at deploy time.
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci installs exactly what package-lock.json pins — reproducible and
      # fails loudly on lockfile drift (the class of bug behind the manualChunks
      # incident). Keep the lockfile in sync in the same commit as package.json.
      - run: npm ci --no-audit --no-fund

      # Lint is advisory for now (167 pre-existing problems, mostly no-explicit-any
      # and unused vars). Visible in CI without blocking; flip to a hard gate once
      # burned down.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      # Typecheck ratchet: the count of `error TS` lines must not exceed the
      # committed baseline (.typecheck-baseline). New type errors fail CI; fixing
      # errors means lowering the baseline in the same PR. Burn to 0, then delete
      # this ratchet and make `tsc --noEmit` a plain hard gate.
      - name: Typecheck (ratchet)
        run: |
          COUNT=$(npm run typecheck 2>&1 | grep -c "error TS" || true)
          BASELINE=$(cat .typecheck-baseline 2>/dev/null || echo 0)
          echo "Typecheck errors: $COUNT (baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::Typecheck errors increased from $BASELINE to $COUNT. New errors:"
            npm run typecheck 2>&1 | grep "error TS" || true
            exit 1
          fi

      - run: npm run test

      - run: npm run build
